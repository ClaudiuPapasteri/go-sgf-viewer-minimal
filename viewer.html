<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/besogo.css">
  <link rel="stylesheet" href="css/board-flat.css">

  <script src="js/besogo.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* important */
      background: #f5f5f5;
    }
  </style>
</head>
<body>

<div id="board"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  const move = params.get("move");

  if (!file) {
    document.body.innerHTML = "No SGF specified.";
  } else {
    const player = besogo.create(document.getElementById("board"), {
      sgf: "sgf/" + file,
      move: move ? parseInt(move) : undefined
    });
  }
</script>

</body>
</html>
