<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/besogo.css">
  <script src="js/besogo.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }
  </style>
</head>
<body>

<!-- Standard div --> 

<div id="board"
     class="besogo-editor"
     data-controls="true"
     data-move-number="false">
</div>


<script>
  // get sgf from URL: ?file=game1.sgf
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  
  // show a specific position instead of full game: 
  // viewer.html?file=game1.sgf&move=87
  
const move = params.get("move");
  if (move) {
    board.setAttribute("data-move", move);  
  }

  if (file) {
    document.getElementById("board")
      .setAttribute("data-sgf", "sgf/" + file);
  } else {
    document.body.innerHTML = "No SGF specified.";
  }
</script>

</body>
</html>
