<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BesoGo</title>

  <style>
    body {
      background: #edffe6;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/besogo.css">

  <!-- Default theme (can be overridden via ?theme=...) -->
  <link rel="stylesheet" href="css/board-flat.css" id="theme-css">

  <!-- Full BesoGo JS stack -->
  <script src="js/besogo.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/gameRoot.js"></script>
  <script src="js/svgUtil.js"></script>
  <script src="js/parseSgf.js"></script>
  <script src="js/loadSgf.js"></script>
  <script src="js/saveSgf.js"></script>
  <script src="js/boardDisplay.js"></script>
  <script src="js/coord.js"></script>
  <script src="js/toolPanel.js"></script>
  <script src="js/filePanel.js"></script>
  <script src="js/controlPanel.js"></script>
  <script src="js/namesPanel.js"></script>
  <script src="js/commentPanel.js"></script>
  <script src="js/treePanel.js"></script>
</head>

<body>

<div id="target"></div>

<script>
(function() {

    var options = { resize: "fill" },
        searchString = location.search.substring(1),
        params = searchString ? searchString.split("&") : [],
        div = document.getElementById('target'),
        i, value;

    // --- Parse URL parameters into options ---
    for (i = 0; i < params.length; i++) {
        value = params[i].split("=");
        options[value.shift()] = value.join("=");
    }

    // --- REQUIRED: map file → sgf URL ---
    if (options.file) {
        options.sgf = "https://raw.githubusercontent.com/ClaudiuPapasteri/go-sgf-viewer-minimal/main/sgf/" + options.file;
        delete options.file;
    } else {
        div.innerHTML = "No SGF specified.";
        return;
    }

    // --- Theme switching ---
    if (options.theme) {
        addStyleLink('css/board-' + options.theme + '.css');
    }

    // --- Fixed size handling ---
    if (options.height && options.width && options.resize === 'fixed') {
        div.style.height = options.height + 'px';
        div.style.width = options.width + 'px';
    }

    // --- Create BesoGo viewer ---
    besogo.create(div, options);

    function addStyleLink(cssURL) {
        var element = document.createElement('link');
        element.href = cssURL;
        element.type = 'text/css';
        element.rel = 'stylesheet';
        document.head.appendChild(element);
    }

})();
</script>

</body>
</html>
